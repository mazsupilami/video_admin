<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng... | Video Admin</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg);
      font-family: var(--font-sans);
      color: var(--text-secondary);
    }
    .loading-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="vendor/sql-wasm.js"></script>
</head>
<body>
  <div class="loading-box">
    <div class="spinner"></div>
    <div>Đang tải hệ thống quản trị video...</div>
  </div>

  <script type="module">
    import { getSession } from './js/core/router-guard.js';
    import { hasAnyUser } from './js/auth/auth-service.js';

    async function route() {
      const session = getSession();
      if (session && session.userId) {
        window.location.replace('dashboard.html');
        return;
      }

      try {
        const usersExist = await hasAnyUser();
        if (!usersExist) {
          window.location.replace('register.html?first=1');
        } else {
          window.location.replace('login.html');
        }
      } catch (err) {
        console.warn('Fallback routing to login', err);
        window.location.replace('login.html');
      }
    }

    route();
  </script>
</body>
</html>
